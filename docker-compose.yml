services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightclaw-backend
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env.production
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: flightclaw-nginx
    ports:
      - "${APP_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped
