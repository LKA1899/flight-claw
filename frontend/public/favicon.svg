<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <!-- fuselage -->
  <rect x="14" y="27" width="38" height="10" rx="5" fill="#fff"/>
  <!-- cockpit windows -->
  <rect x="44" y="28" width="6" height="8" rx="2" fill="#bfdbfe"/>
  <!-- passenger windows -->
  <circle cx="24" cy="32" r="1.5" fill="#2563eb"/>
  <circle cx="28" cy="32" r="1.5" fill="#2563eb"/>
  <circle cx="32" cy="32" r="1.5" fill="#2563eb"/>
  <circle cx="36" cy="32" r="1.5" fill="#2563eb"/>
  <circle cx="40" cy="32" r="1.5" fill="#2563eb"/>
  <!-- left wing -->
